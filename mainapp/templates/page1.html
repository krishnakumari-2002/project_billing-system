{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Billing Page</title>
    <link rel="stylesheet" href="{% static 'mainapp/style.css' %}">
</head>
<body>

<h2>Billing Page</h2>

<form id="billingForm">

    <!-- Customer Email -->
    <label>Customer Email:</label>
    <input type="email" id="customer_email" placeholder="Email ID" required>

    <hr>

    <!-- Product Section -->
    <h3>Products</h3>
    <div id="productContainer">
        <div class="product-row">
            <input type="number" class="product_id" placeholder="Product ID">
            <input type="number" class="quantity" placeholder="Quantity">
        </div>
    </div>
    <button type="button" onclick="addProduct()">Add Product</button>

    <hr>

    <!-- Denominations -->
    <h3>Denominations Given By Customer</h3>
    <div class="denomination-section">
        <label>500: <input type="number" id="d500" placeholder="Count"></label>
        <label>50: <input type="number" id="d50" placeholder="Count"></label>
        <label>20: <input type="number" id="d20" placeholder="Count"></label>
        <label>10: <input type="number" id="d10" placeholder="Count"></label>
        <label>5: <input type="number" id="d5" placeholder="Count"></label>
        <label>2: <input type="number" id="d2" placeholder="Count"></label>
        <label>1: <input type="number" id="d1" placeholder="Count"></label>
    </div>

    <hr>

    <!-- Amount Paid -->
    <label>Total Paid Amount:</label>
    <input type="number" id="amount_paid" placeholder="Amount">

    <br><br>

    <button type="button" onclick="generateBill()">Generate Bill</button>
    
</form>

<!-- Div to display the generated bill -->
<div id="billDetails"></div>

<!-- JS File -->
<script src="{% static 'mainapp/page1.js' %}"></script>

</body>
</html>
